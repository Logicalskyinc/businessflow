services:
  - type: web
    name: businessflow-api
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/Logicalskyinc/businessflow
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUSINESSFLOW_ALLOWED_ORIGINS
        value: https://logicalskyinc.github.io
      - key: SUPABASE_URL
        value: https://xsembvcmcodcseqnpyrr.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OYOSKY_SERVICE_URL
        value: https://oyosky.onrender.com
      - key: OYOSKY_BUSINESSFLOW_SERVICE_TOKEN
        sync: false
      - key: GREY_SERVICE_URL
        value: https://grey-chat-preview.onrender.com
      - key: GREY_BUSINESSFLOW_JWT_SECRET
        sync: false
