name: BusinessFlow mobile responsive checks

on:
  pull_request:
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "backend/test/mobile-responsive.test.js"
      - ".github/workflows/businessflow-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-responsive:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and WebKit browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run responsive layout tests
        run: node --test test/mobile-responsive.test.js
