name: BusinessFlow Content Studio checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/eman-content-studio"]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check content-studio.js
      - name: Test Content Studio integration contract
        run: python -m unittest discover -s tests -v
