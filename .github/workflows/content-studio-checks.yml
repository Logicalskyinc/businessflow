name: BusinessFlow Content Studio checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/eman-content-studio"]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check content-studio.js
      - name: Test Content Studio integration contract
        run: python -m unittest discover -s tests -v

  migration-permission-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate the permission migration on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;

          CREATE FUNCTION public.rls_auto_enable()
          RETURNS event_trigger
          LANGUAGE plpgsql
          AS $function$
          BEGIN
            RETURN;
          END;
          $function$;

          GRANT EXECUTE ON FUNCTION public.rls_auto_enable()
            TO PUBLIC, anon, authenticated, service_role;
          SQL

          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261017140000_restrict_rls_auto_enable_execute.sql

          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $assert$
          BEGIN
            IF has_function_privilege('anon', 'public.rls_auto_enable()', 'EXECUTE') THEN
              RAISE EXCEPTION 'FAIL: anon can still execute rls_auto_enable()';
            END IF;

            IF has_function_privilege('authenticated', 'public.rls_auto_enable()', 'EXECUTE') THEN
              RAISE EXCEPTION 'FAIL: authenticated can still execute rls_auto_enable()';
            END IF;

            IF NOT has_function_privilege('service_role', 'public.rls_auto_enable()', 'EXECUTE') THEN
              RAISE EXCEPTION 'FAIL: service_role lost execute permission';
            END IF;

            IF NOT has_function_privilege('postgres', 'public.rls_auto_enable()', 'EXECUTE') THEN
              RAISE EXCEPTION 'FAIL: function owner lost execute permission';
            END IF;
          END;
          $assert$;
          SQL
