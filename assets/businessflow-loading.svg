<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 437 389" role="img" aria-labelledby="title"><title id="title">BusinessFlow loading</title><defs><radialGradient id="bg"><stop stop-color="#001a4a"/><stop offset="1" stop-color="#000724"/></radialGradient><linearGradient id="cyan" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#00a8ff"/><stop offset=".55" stop-color="#00f5ff"/><stop offset="1" stop-color="#43ffff"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="437" height="389" fill="url(#bg)"/><g class="trail" filter="url(#glow)"><path d="M72 208 Q128 162 185 174" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round"/><circle cx="72" cy="208" r="5" fill="#fff"/></g><g class="brand"><path d="M136 81h121c73 0 112 31 112 83 0 28-13 50-38 63 26 12 39 34 39 64 0 56-43 89-117 89H136V81zm62 57v81h68c26 0 40-14 40-41s-14-40-40-40h-68zm0 134v58h61c29 0 44-10 44-30 0-19-15-28-44-28h-61z" fill="url(#cyan)"/><text x="218" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#fff">Business<tspan fill="#00eaff">Flow</tspan></text></g><style>.brand{opacity:0;transform-origin:50% 50%;animation:brand-in 2.4s ease-in-out infinite}.trail{transform-origin:50% 50%;animation:trail-out 2.4s ease-in-out infinite}@keyframes brand-in{0%,35%{opacity:0;transform:scale(.84)}65%,100%{opacity:1;transform:scale(1)}}@keyframes trail-out{0%{opacity:1;transform:translateX(-24px) scale(1)}38%,100%{opacity:0;transform:translateX(70px) scale(.2)}}@media(prefers-reduced-motion:reduce){.brand,.trail{animation:none}.brand{opacity:1}.trail{opacity:0}}</style></svg>